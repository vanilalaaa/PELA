# Profile dev — mặc định khi chạy ./gradlew bootRun (xem build.gradle.kts).
spring:
  flyway:
    # Migration thật + seed dev (R__dev_seed.sql)
    locations: ${FLYWAY_LOCATIONS:filesystem:../db/migrations,filesystem:../db/seed}

logging:
  level:
    # Câu SQL do JdbcTemplate chạy. Không bật TRACE cho StatementCreatorUtils: giá trị bind có thể chứa PII.
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.flywaydb: INFO
