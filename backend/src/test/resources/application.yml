# Giá trị giả cho test — không phải secret thật.
spring:
  flyway:
    # Stub schema auth của Supabase (chỉ test) + migration thật
    locations: classpath:db/stub,filesystem:../db/migrations
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.invalid/auth/v1
          jwk-set-uri: https://example.invalid/auth/v1/.well-known/jwks.json

# Giống main: springdoc tắt mặc định, profile dev bật
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

pela:
  gemini:
    api-key: test
