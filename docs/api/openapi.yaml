openapi: 3.1.0
info:
  title: PELA API
  version: 0.1.0
  description: |
    REST API của PELA — Personalized English Learning Application.
    Mọi endpoint nằm dưới tiền tố `/v1`. `userId` luôn lấy từ JWT (SEC-4), không lấy từ body.

    Mọi request đã xác thực tới `/v1/**` (trừ `POST /v1/auth/logout`) đi qua kiểm tra trạng thái tài khoản
    từ bảng users (cache 60 giây), kể cả khi JWT còn hạn: tài khoản suspended hoặc pending_deletion nhận
    403 theo `components.responses.AccountBlocked`.
servers:
  - url: http://localhost:8080/v1
    description: Local
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái dịch vụ
      operationId: getHealth
      security: []
      tags: [platform]
      responses:
        '200':
          description: Dịch vụ hoạt động
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /auth/register:
    post:
      summary: Đăng ký tài khoản email (UC-01 1.0, Auth.Register)
      description: |
        Mật khẩu tối thiểu 8 ký tự, có chữ hoa, chữ thường và chữ số (Auth.Register.Validate).
        Tài khoản tạo ở trạng thái `unverified`; Supabase gửi email xác minh (Auth.Register.Verify).
      operationId: register
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponse'}
        '409':
          description: "Email đã đăng ký (BR-1). Mã: EMAIL_ALREADY_REGISTERED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /auth/login:
    post:
      summary: Đăng nhập email/mật khẩu (UC-01 2.0, Auth.Login)
      description: |
        Backend đếm lần sai (Auth.Login.Lockout, SEC-5): sai `auth.lockout_max_attempts` lần trong
        `auth.lockout_minutes` phút thì khoá `auth.lockout_minutes` phút. Lý do khoá tài khoản / chưa xác minh
        chỉ được trả khi mật khẩu đúng.
      operationId: login
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401':
          description: "Sai email hoặc mật khẩu. Mã: INVALID_CREDENTIALS"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '403':
          description: |
            Mã EMAIL_NOT_VERIFIED; ACCOUNT_SUSPENDED kèm details {reason, suspendedUntil}
            (suspendedUntil null = khoá vĩnh viễn); hoặc ACCOUNT_PENDING_DELETION kèm details
            {deletionScheduledAt} = deletion_requested_at + account.deletion_grace_days (BR-33).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '423':
          description: "Tạm khoá do sai nhiều lần. Mã: ACCOUNT_LOCKED, details {lockedUntil}"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /auth/refresh:
    post:
      summary: Làm mới phiên (Auth.Login.Session)
      operationId: refreshSession
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: Phiên mới
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401':
          description: "Mã: INVALID_REFRESH_TOKEN"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /auth/logout:
    post:
      summary: Đăng xuất (Auth.Logout)
      description: Mặc định chỉ thiết bị hiện tại; `allDevices = true` để thoát mọi thiết bị (Auth.Logout.MultiDevice).
      operationId: logout
      tags: [identity]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allDevices: {type: boolean, default: false}
      responses:
        '204': {description: Đã đăng xuất}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password/forgot:
    post:
      summary: Gửi mã khôi phục 6 số (Auth.Recover.Request)
      description: Luôn trả 202 dù email có tồn tại hay không. Mã hết hạn sau 5 phút (Auth.Recover.Expire, cấu hình ở Supabase Auth).
      operationId: forgotPassword
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Đã tiếp nhận}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /auth/password/verify-otp:
    post:
      summary: Xác minh mã khôi phục, nhận reset token dùng một lần
      description: |
        `resetToken` là chuỗi ngẫu nhiên (256 bit, base64url) dùng một lần, hạn
        `auth.password_reset_ttl_minutes` phút (mặc định 10). Phiên khôi phục của Supabase được backend
        giữ phía server; client không nhận access token của phiên này. Xác minh lại sẽ huỷ token trước đó.
      operationId: verifyPasswordOtp
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string, format: email}
                code: {type: string, pattern: '^\d{6}$'}
      responses:
        '200':
          description: Mã đúng
          content:
            application/json:
              schema:
                type: object
                required: [resetToken, expiresIn]
                properties:
                  resetToken: {type: string, minLength: 43, description: Token ngẫu nhiên dùng một lần}
                  expiresIn: {type: integer, description: 'Số giây (auth.password_reset_ttl_minutes × 60)', examples: [600]}
        '422':
          description: "Mã sai hoặc hết hạn: INVALID_OTP; hoặc VALIDATION_FAILED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /auth/password/reset:
    post:
      summary: Đặt mật khẩu mới (Auth.Recover.Reset)
      operationId: resetPassword
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword, confirmPassword]
              properties:
                resetToken: {type: string}
                newPassword: {type: string, minLength: 8, maxLength: 72}
                confirmPassword: {type: string}
      responses:
        '204': {description: Đã đổi mật khẩu}
        '401':
          description: "Mã: INVALID_RESET_TOKEN — token không tồn tại, đã dùng hoặc đã hết hạn"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "VALIDATION_FAILED, WEAK_PASSWORD hoặc SAME_PASSWORD"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503': {$ref: '#/components/responses/AuthProviderUnavailable'}
  /me:
    get:
      summary: Hồ sơ của người đang đăng nhập (SEC-4)
      operationId: getMe
      tags: [identity]
      responses:
        '200':
          description: Hồ sơ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Mã: USER_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/me:
    get:
      summary: Hồ sơ Admin — Admin web gọi để xác nhận quyền (SEC-3)
      description: |
        Mọi `/v1/admin/**` đọc role + status từ bảng users (không tin claim JWT), cache 60 giây.
        Không phải Admin đang hoạt động thì 403 ADMIN_REQUIRED.
      operationId: getAdminMe
      tags: [identity, admin]
      responses:
        '200':
          description: Hồ sơ Admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED, hoặc ACCOUNT_SUSPENDED / ACCOUNT_PENDING_DELETION (xem AccountBlocked)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/writing/prompts/generate:
    post:
      summary: Để AI tạo đề Writing mới (UC-24, RAG.*, BR-7, BR-8, BR-24, BR-25)
      description: |
        Luôn trả một đề. Server tìm đề tương tự cùng topic + trình độ của learner, rồi nhờ AI viết đề mới; nếu được thì
        `promptSource = ai_generated` kèm `ragCacheId` (đề nằm ở cache, không vào kho đề). Khi không tạo được (độ tương
        đồng dưới ngưỡng, AI quá hạn/lỗi/bị chặn, đề sai dạng, hết lượt AI trong ngày `writing.ai_prompt_daily_limit`) thì
        trả một đề có sẵn cùng topic + trình độ mà learner chưa làm: `promptSource = bank` kèm `questionId` và
        `fallbackReason` (BELOW_THRESHOLD, TIMEOUT, INVALID_JSON, SAFETY_BLOCKED, FILTERED, DAILY_LIMIT, NO_EMBEDDING,
        INVALID_OUTPUT, UPSTREAM_ERROR, BUDGET_EXHAUSTED: còn ít hơn `rag.generation.min_llm_ms` của ngân sách thì không gọi AI). Toàn chuỗi nằm trong ngân sách `ai.question_gen_p95_budget_ms`.
        Nộp bài (`POST /practice/writing/submissions`) gửi lại đúng `promptSource` và `ragCacheId` hoặc
        `promptQuestionId`. `taskType` tuỳ chọn: không gửi thì AI giữ dạng bài của đề mẫu gần nhất.
        Đề AI chỉ nộp được bởi chính learner đã nhận nó.
      operationId: generateWritingPrompt
      tags: [writing]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateWritingPromptRequest'}
      responses:
        '200':
          description: Đề để làm bài
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritingPromptChoice'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Kho không có đề nào cho topic + trình độ. Mã: NO_PROMPT_AVAILABLE"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "LEVEL_REQUIRED (learner chưa có trình độ), INVALID_TASK_TYPE hoặc VALIDATION_FAILED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/writing/prompts:
    get:
      summary: Đề có sẵn gợi ý theo topic (UC-10, Writing.Prompt.Select)
      description: |
        Đề đang dùng của kho cùng topic + trình độ hiện tại của learner: đề chưa làm trước, rồi đề làm lâu nhất.
      operationId: listWritingPrompts
      tags: [writing]
      parameters:
        - {name: topic, in: query, required: true, schema: {type: string, maxLength: 100}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
      responses:
        '200':
          description: Danh sách đề gợi ý
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WritingBankPrompt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '422':
          description: "LEVEL_REQUIRED hoặc VALIDATION_FAILED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/writing/submissions:
    post:
      summary: Nộp bài Writing để chấm (UC-10, Writing.Submit, BR-29)
      description: |
        `submissionId` do client sinh (UUID) để gửi lại an toàn: gửi lại cùng id trả trạng thái hiện tại, không
        nộp lần hai. Server tự đếm từ (20–300 từ, hoặc khoảng hẹp hơn của đề `min_words`/`max_words`).
        Bài được chấm bất đồng bộ (UC-23); client hỏi `GET /practice/writing/submissions/{submissionId}`.
        Lượt chấm (`writing.daily_limit`/ngày theo múi giờ learner) chỉ bị trừ khi chấm thành công; bài đang chờ
        chấm cũng được tính để không nộp vượt. Hết lượt → 429, bài được giữ dưới dạng nháp (`draft`), nộp lại
        cùng `submissionId` vào ngày sau.
      operationId: submitWriting
      tags: [writing]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WritingSubmitRequest'}
      responses:
        '202':
          description: Đã nhận, đang chờ chấm (hoặc trạng thái hiện tại nếu gửi lại cùng id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritingSubmitResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Đề trong kho không có hoặc đã ngừng dùng, hoặc đề AI chưa từng được phát cho người gọi. Mã: PROMPT_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "submissionId đã được người khác dùng. Mã: SUBMISSION_ID_CONFLICT"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: |
            WORD_COUNT_OUT_OF_RANGE — details {wordCount, minWords, maxWords}; hoặc VALIDATION_FAILED (thiếu
            `promptQuestionId` khi bank, thiếu `ragCacheId` khi ai_generated).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: |
            Hết lượt chấm hôm nay. Mã: WRITING_QUOTA_EXCEEDED, details {submissionId, status: draft, dailyLimit,
            resetsAt}. Bài đã được lưu nháp.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    get:
      summary: Lịch sử bài viết và xu hướng điểm (Writing.History.List)
      operationId: listWritingSubmissions
      tags: [writing]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Bài mới nhất trước; scoreTrend theo thời gian chấm, cũ → mới
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritingHistory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
  /practice/writing/submissions/{submissionId}:
    get:
      summary: Kết quả chấm một bài (Writing.Grade.Output, UC-23)
      description: |
        `status`: draft | pending | retry_queued (AI lỗi/timeout 2 lần, job chấm lại lúc `nextRetryAt`) |
        graded | failed (hết số lần thử, không trừ lượt). Điểm và sao do server tính từ 4 tiêu chí (BR-18).
        Vị trí lỗi (`startOffset`, `endOffset`) là chỉ số ký tự trong `submittedText`, do server tính.
        Nội dung AI sinh đã qua bộ lọc BR-15.
      operationId: getWritingSubmission
      tags: [writing]
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bài viết
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritingSubmission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Không có hoặc không phải bài của người gọi. Mã: SUBMISSION_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/writing/vocab-suggestions/{suggestionId}/add:
    post:
      summary: Thêm "từ đáng học" vào hàng ôn SM-2 (BR-30, BR-9)
      description: |
        Từ chưa có trong kho chung được thêm vào kho riêng của learner, rồi đưa vào hàng ôn hôm nay.
        Từ có sẵn trong kho chung đã được tự thêm khi chấm (`auto_added`). Gọi lại trả trạng thái hiện tại.
      operationId: addWritingVocabSuggestion
      tags: [writing]
      parameters:
        - {name: suggestionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Đã thêm
          content:
            application/json:
              schema:
                type: object
                required: [suggestionId, status, vocabId]
                properties:
                  suggestionId: {type: string, format: uuid}
                  status: {type: string, enum: [added, auto_added]}
                  vocabId: {type: string, format: uuid}
                  reviewCardId: {type: [string, 'null'], format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Mã: SUGGESTION_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "Learner đã bỏ qua từ này. Mã: SUGGESTION_DISMISSED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/question-bank/embeddings/backfill:
    post:
      summary: Tạo bù embedding đề Writing (BR-14)
      description: |
        Chạy nền: embed lại đề Writing active có `embedding_model` khác `ai.model.embedding`, và embed rồi kích hoạt
        đề chưa từng kích hoạt (retired, `retired_at` null, chưa có embedding — vd seed dev). Đề do Admin retire không
        bị đụng. Embed theo lô `rag.embedding.backfill_batch_size`, nghỉ `rag.embedding.backfill_pause_ms` giữa các lô;
        gặp rate limit thì dừng, gọi lại sau. Profile dev tự chạy khi khởi động.
      operationId: backfillPromptEmbeddings
      tags: [rag, admin]
      responses:
        '202':
          description: Đã bắt đầu
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: started}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED, hoặc ACCOUNT_SUSPENDED / ACCOUNT_PENDING_DELETION (xem AccountBlocked)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "Đang có lượt tạo bù khác. Mã: BACKFILL_RUNNING"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/listening/topics:
    get:
      summary: Topic có bài nghe ở một cấp CEFR (UC-11, Listening.Select)
      operationId: listListeningTopics
      tags: [listening]
      parameters:
        - name: level
          in: query
          required: true
          schema: {$ref: '#/components/schemas/CefrLevel'}
      responses:
        '200':
          description: Topic có ít nhất một bài nghe chơi được (published, đã có audio, còn câu hỏi), theo tên
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [topic, clipCount]
                  properties:
                    topic: {type: string}
                    clipCount: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /practice/listening/clips:
    get:
      summary: Bài nghe của một topic + cấp, theo thứ tự Admin đặt (Listening.Select.Source)
      description: Sắp theo `orderIndex`; không gợi ý, không lọc theo độ khó, không sắp lại (DE-5).
      operationId: listListeningClips
      tags: [listening]
      parameters:
        - {name: topic, in: query, required: true, schema: {type: string}}
        - {name: level, in: query, required: true, schema: {$ref: '#/components/schemas/CefrLevel'}}
      responses:
        '200':
          description: Danh sách bài nghe
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ListeningClipItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /practice/listening/clips/{clipId}:
    get:
      summary: Chi tiết bài nghe để làm bài (UC-11)
      description: |
        URL audio ký tạm (hết hạn sau `listening.audio_url_ttl_sec`) và câu hỏi. Không trả đáp án, giải thích hay
        transcript trước khi nộp; chúng nằm trong kết quả `POST /practice/listening/sessions`.
      operationId: getListeningClip
      tags: [listening]
      parameters:
        - {name: clipId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bài nghe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListeningClipView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Không có, đã retire hoặc chưa có audio. Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /practice/listening/sessions:
    post:
      summary: Nộp đáp án một phiên nghe (UC-11, Listening.Score, BR-16, BR-23, BR-36)
      description: |
        `sessionId` do client sinh (UUID); client gửi đáp án thô (chữ cái A–D) của mọi câu hỏi theo một lô. Server
        chấm lại, tính sao theo `star.bands` (BR-16). Làm lại bài: `starsAdded` chỉ là phần vượt sao tốt nhất trước đó
        (BR-36). Gửi lại cùng `sessionId` trả đúng kết quả đã lưu, không chấm và không cộng sao lần hai. Kết quả
        kèm đáp án đúng, giải thích và transcript có bản dịch.
      operationId: submitListeningSession
      tags: [listening]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListeningSubmitRequest'}
      responses:
        '200':
          description: Kết quả chấm
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListeningSessionResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccountBlocked'}
        '404':
          description: "Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "sessionId đã dùng cho người khác hoặc bài khác. Mã: SESSION_ID_CONFLICT"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: |
            ANSWERS_MISMATCH (thiếu / thừa / trùng câu hỏi; mỗi câu hỏi active của bài đúng một đáp án) hoặc
            INVALID_ANSWER (không phải A–D).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/imports:
    post:
      summary: Tải file nhập Listening (UC-19, Admin.QuestionBank.ImportListening)
      description: |
        Chỉ `kind = listening_csv`. Kiểm đuôi `.csv` + kiểu MIME và dung lượng (`import.max_csv_mb`), lưu file vào
        bucket `imports`, tạo job `queued` rồi xử lý nền: đọc + kiểm theo mẫu và BR-37 → `preview_ready` (preview
        theo bài + `warnings` theo dòng/cột), hoặc `failed` khi sai cột / không phải UTF-8 / không có bài nào.
        Theo dõi bằng `GET /admin/imports/{jobId}`.
      operationId: uploadImport
      tags: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: {type: string, enum: [listening_csv]}
                file: {type: string, format: binary}
      responses:
        '202':
          description: Job đã tạo (status queued)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED, hoặc ACCOUNT_SUSPENDED / ACCOUNT_PENDING_DELETION (xem AccountBlocked)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "UNSUPPORTED_IMPORT_KIND, UNSUPPORTED_FILE_TYPE, FILE_EMPTY, FILE_TOO_LARGE (details {maxBytes, bytes})"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/imports/templates/listening:
    get:
      summary: Tải file CSV mẫu nhập Listening
      operationId: getListeningImportTemplate
      tags: [admin]
      responses:
        '200':
          description: "Cột: clip_code, title, topic, cefr_level, row_type, speaker, voice, text_en, text_vi, question_type, option_a…option_d, answer, explanation"
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/imports/{jobId}:
    get:
      summary: Trạng thái và preview của job nhập
      operationId: getImport
      tags: [admin]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: IMPORT_JOB_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/imports/{jobId}/preview:
    patch:
      summary: Admin sửa preview (Admin.QuestionBank.Preview, BR-34)
      description: |
        Thay toàn bộ danh sách bài; server kiểm lại BR-37 và trả `warnings` mới. Audio đã sinh được giữ theo vị trí
        bài nhưng `audio.current = false` khi lời thoại hoặc giọng không còn khớp: phải sinh lại trước khi lưu.
      operationId: updateImportPreview
      tags: [admin]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clips]
              properties:
                clips:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/ListeningClipDraft'}
      responses:
        '200':
          description: Job sau khi sửa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: IMPORT_JOB_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "Job không ở preview_ready. Mã: IMPORT_NOT_EDITABLE"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "Mã: NO_CLIPS"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/imports/{jobId}/clips/{clipIndex}/tts:
    post:
      summary: Sinh audio TTS cho một bài của preview (Admin.QuestionBank.Tts, BR-37, AS-16)
      description: |
        Gọi TTS (`ai.model.tts`) với giọng của từng người nói và cách đọc theo cấp (`ai.tts.style_by_level`), lưu WAV
        tạm ở bucket `imports`, trả URL ký tạm để nghe thử. `attempts` của job + 1. Audio được gắn dấu vân tay của
        lời thoại + giọng hiện tại. Bài còn lỗi BR-37 hoặc người nói chưa có giọng thì không sinh.
      operationId: generateImportClipAudio
      tags: [admin]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: clipIndex, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Audio nghe thử
          content:
            application/json:
              schema:
                type: object
                required: [clipIndex, audioUrl, durationSec, fingerprint, attempts]
                properties:
                  clipIndex: {type: integer}
                  audioUrl: {type: string, format: uri}
                  durationSec: {type: integer}
                  fingerprint: {type: string}
                  attempts: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "IMPORT_JOB_NOT_FOUND hoặc CLIP_NOT_FOUND (không có bài ở vị trí này)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "Mã: IMPORT_NOT_EDITABLE"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "LISTENING_CLIP_INVALID (details.issues) hoặc VOICE_REQUIRED (details.speaker)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/imports/{jobId}/save:
    post:
      summary: Lưu các bài nghe của job (Admin.QuestionBank.Save, BR-14, BR-35, BR-37)
      description: |
        Chỉ khi không còn lỗi BR-37 và mọi bài có audio khớp lời thoại + giọng hiện tại. Audio được chép sang bucket
        `listening-audio`; mỗi bài tạo `listening_clip` (voice_config, tts_model, audio_format, duration_sec,
        order_index tiếp theo trong topic + cấp) và `question_bank` (question_purpose = listening) trong một
        transaction cùng nhật ký Admin và trạng thái job `saved`. Lỗi thì không lưu gì.
      operationId: saveImport
      tags: [admin]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Đã lưu; bài hiển thị cho learner ngay
          content:
            application/json:
              schema:
                type: object
                required: [jobId, clipIds]
                properties:
                  jobId: {type: string, format: uuid}
                  clipIds: {type: array, items: {type: string, format: uuid}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: IMPORT_JOB_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "AUDIO_OUT_OF_DATE (details.clipIndexes: bài chưa có audio hoặc audio không khớp) hoặc IMPORT_NOT_EDITABLE"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "Còn lỗi BR-37. Mã: IMPORT_HAS_ERRORS (details.issues)"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/listening/clips/{clipId}:
    get:
      summary: Chi tiết bài nghe đã lưu, kèm đáp án (UC-19)
      operationId: getAdminListeningClip
      tags: [admin, listening]
      parameters:
        - {name: clipId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bài nghe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListeningClip'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    patch:
      summary: Sửa bài nghe đã lưu (UC-19, BR-35, BR-37)
      description: |
        Trường bỏ trống giữ nguyên; câu hỏi nhận diện bằng `questionId`. Đổi `lines` hoặc `voices` thì phải gửi
        `audioToken` lấy từ `POST /admin/listening/clips/{clipId}/tts` với đúng lời thoại + giọng mới. Ghi nhật ký
        trước/sau.
      operationId: updateAdminListeningClip
      tags: [admin, listening]
      parameters:
        - {name: clipId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                voices: {type: object, additionalProperties: {type: string}}
                lines:
                  type: array
                  items: {$ref: '#/components/schemas/ListeningLineDraft'}
                questions:
                  type: array
                  items:
                    type: object
                    required: [questionId]
                    properties:
                      questionId: {type: string, format: uuid}
                      text: {type: string}
                      options: {type: array, minItems: 4, maxItems: 4, items: {type: string}}
                      answer: {type: string, enum: [A, B, C, D]}
                      explanation: {type: string}
                audioToken: {type: string}
      responses:
        '200':
          description: Bài sau khi sửa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListeningClip'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: "AUDIO_REGENERATION_REQUIRED (details.fingerprint) hoặc CLIP_RETIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "LISTENING_CLIP_INVALID (details.issues) hoặc QUESTION_NOT_IN_CLIP"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/listening/clips/{clipId}/tts:
    post:
      summary: Sinh audio nghe thử cho lời thoại + giọng mới của bài đã lưu (BR-37)
      operationId: previewAdminListeningClipAudio
      tags: [admin, listening]
      parameters:
        - {name: clipId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voices, lines]
              properties:
                voices: {type: object, additionalProperties: {type: string}}
                lines:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/ListeningLineDraft'}
      responses:
        '200':
          description: Audio nghe thử; gửi `audioToken` kèm bản sửa
          content:
            application/json:
              schema:
                type: object
                required: [audioToken, fingerprint, audioUrl, durationSec]
                properties:
                  audioToken: {type: string}
                  fingerprint: {type: string}
                  audioUrl: {type: string, format: uri}
                  durationSec: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: "LISTENING_CLIP_INVALID hoặc VOICE_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/listening/clips/{clipId}/retire:
    post:
      summary: Retire bài nghe (BR-34, BR-35)
      description: Ẩn bài và câu hỏi khỏi learner; không xoá bài, câu hỏi hay lịch sử làm bài. Gọi lại khi đã retire không đổi gì.
      operationId: retireAdminListeningClip
      tags: [admin, listening]
      parameters:
        - {name: clipId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Bài sau khi retire
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListeningClip'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: "Mã: ADMIN_REQUIRED"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: "Mã: CLIP_NOT_FOUND"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Supabase Auth cấp.
  responses:
    BadRequest:
      description: "Request sai cú pháp. Mã: MALFORMED_REQUEST, BAD_REQUEST"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: "Thiếu hoặc sai access token. Mã: UNAUTHENTICATED, INVALID_TOKEN. Có header WWW-Authenticate: Bearer"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: "Không có quyền. Mã mặc định: FORBIDDEN"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: "Không tìm thấy. Mã mặc định: NOT_FOUND"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: "Xung đột trạng thái. Mã mặc định: CONFLICT"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ValidationFailed:
      description: "Dữ liệu không hợp lệ hoặc vi phạm luật nghiệp vụ. Mã: VALIDATION_FAILED; details là danh sách {field, message}"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Locked:
      description: "Tài nguyên bị khoá (tài khoản, Final Test…). Mã mặc định: LOCKED"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TooManyRequests:
      description: "Vượt giới hạn số lần. Mã mặc định: TOO_MANY_REQUESTS"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError:
      description: "Lỗi không mong đợi. Mã: INTERNAL_ERROR (không lộ chi tiết nội bộ)"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AccountBlocked:
      description: |
        Tài khoản không được dùng (kể cả khi JWT còn hạn). Mã:
        ACCOUNT_SUSPENDED — details {reason, suspendedUntil}; suspendedUntil null = khoá vĩnh viễn (UC-16).
        ACCOUNT_PENDING_DELETION — details {deletionScheduledAt} (BR-33).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthProviderUnavailable:
      description: "Supabase Auth tạm thời không dùng được. Mã: AUTH_PROVIDER_UNAVAILABLE"
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Mã lỗi ổn định, dạng UPPER_SNAKE_CASE
              examples: [VALIDATION_FAILED]
            message:
              type: string
              description: Mô tả ngắn cho người phát triển
            details:
              description: Thông tin bổ sung (ví dụ lỗi theo từng field)
              type: [object, array, 'null']
    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword]
      properties:
        fullName: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 150}
        password: {type: string, minLength: 8, maxLength: 72, description: 'Có chữ hoa, chữ thường, chữ số'}
        confirmPassword: {type: string}
    RegisterResponse:
      type: object
      required: [userId, email, status]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        status: {type: string, const: unverified}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: {type: string, description: JWT Supabase; gửi kèm header Authorization Bearer}
        refreshToken: {type: string}
        expiresIn: {type: integer, description: Số giây tới khi access token hết hạn}
        tokenType: {type: string, const: bearer}
    Me:
      type: object
      required: [userId, email, fullName, role, status, timezone]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        username: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        role: {type: string, enum: [learner, admin]}
        status: {type: string, enum: [unverified, active, suspended, pending_deletion]}
        cefrLevel: {type: [string, 'null'], enum: [A1, A2, B1, B2, C1, C2, null]}
        timezone: {type: string}
    WritingSubmitRequest:
      type: object
      required: [submissionId, promptSource, text]
      properties:
        submissionId: {type: string, format: uuid, description: Do client sinh; gửi lại cùng id là an toàn}
        promptSource: {type: string, enum: [bank, ai_generated, freeform]}
        promptQuestionId: {type: [string, 'null'], format: uuid, description: Bắt buộc khi promptSource = bank}
        ragCacheId: {type: [string, 'null'], format: uuid, description: 'Bắt buộc khi promptSource = ai_generated; đề phải đã được phát cho người gọi (UC-24)'}
        text: {type: string, maxLength: 5000}
    GenerateWritingPromptRequest:
      type: object
      required: [topic]
      properties:
        topic: {type: string, maxLength: 100}
        taskType: {type: [string, 'null'], enum: [email, paragraph, essay, null], description: Tuỳ chọn; không gửi thì AI giữ dạng bài của đề mẫu gần nhất (BR-24)}
    WritingPromptChoice:
      type: object
      required: [promptSource, promptText, cacheHit]
      properties:
        promptSource: {type: string, enum: [ai_generated, bank], description: Dùng đúng giá trị này khi nộp bài}
        ragCacheId: {type: [string, 'null'], format: uuid, description: Có khi promptSource = ai_generated}
        questionId: {type: [string, 'null'], format: uuid, description: 'Có khi promptSource = bank (gửi là promptQuestionId khi nộp bài)'}
        promptText: {type: string}
        taskType: {type: [string, 'null'], enum: [email, paragraph, essay, null]}
        minWords: {type: [integer, 'null']}
        maxWords: {type: [integer, 'null']}
        cacheHit: {type: boolean, description: Đề AI lấy từ cache thay vì mới tạo}
        fallbackReason:
          type: [string, 'null']
          enum: [BELOW_THRESHOLD, TIMEOUT, INVALID_JSON, SAFETY_BLOCKED, FILTERED, DAILY_LIMIT, NO_EMBEDDING, INVALID_OUTPUT, UPSTREAM_ERROR, BUDGET_EXHAUSTED, null]
          description: Có khi đề bank được phát vì không tạo được đề AI (BR-7)
    WritingBankPrompt:
      type: object
      required: [questionId, text, done]
      properties:
        questionId: {type: string, format: uuid}
        text: {type: string}
        taskType: {type: [string, 'null'], enum: [email, paragraph, essay, null]}
        minWords: {type: [integer, 'null']}
        maxWords: {type: [integer, 'null']}
        done: {type: boolean, description: Learner đã nộp bài với đề này}
    WritingSubmitResult:
      type: object
      required: [submissionId, status]
      properties:
        submissionId: {type: string, format: uuid}
        status: {type: string, enum: [pending, retry_queued, graded, failed]}
    WritingIssue:
      type: object
      required: [issueId, sentenceIndex, startOffset, endOffset, original, suggestion, category, severity, explanationVi]
      properties:
        issueId: {type: string, format: uuid}
        sentenceIndex: {type: integer, minimum: 0}
        startOffset: {type: integer, minimum: 0}
        endOffset: {type: integer, description: Không gồm ký tự tại vị trí này}
        original: {type: string}
        suggestion: {type: string, description: Rỗng = nên xoá đoạn này}
        category: {type: string, enum: [grammar, spelling, word_choice, repetition, punctuation, style]}
        severity: {type: string, enum: [error, suggestion], description: style luôn là suggestion (không trừ điểm)}
        explanationVi: {type: string}
    WritingVocabSuggestion:
      type: object
      required: [suggestionId, learnerForm, word, reason, meaningVi, status]
      properties:
        suggestionId: {type: string, format: uuid}
        learnerForm: {type: string}
        word: {type: string}
        reason: {type: string, enum: [misspelled, misused, wrong_form, better_alternative]}
        meaningVi: {type: string}
        cefrLevel: {type: [string, 'null'], enum: [A1, A2, B1, B2, C1, C2, null]}
        status: {type: string, enum: [suggested, added, dismissed, auto_added]}
    WritingSubmission:
      type: object
      required: [submissionId, status, promptSource, submittedText, wordCount, rewrites, issues, vocabSuggestions]
      properties:
        submissionId: {type: string, format: uuid}
        status: {type: string, enum: [draft, pending, retry_queued, graded, failed]}
        promptSource: {type: string, enum: [bank, ai_generated, freeform]}
        promptText: {type: [string, 'null']}
        submittedText: {type: string}
        wordCount: {type: integer}
        score: {type: [integer, 'null'], minimum: 0, maximum: 100}
        starsEarned: {type: [integer, 'null'], minimum: 0, maximum: 5}
        criteria:
          type: [object, 'null']
          description: Mỗi tiêu chí 0–25
          properties:
            task_achievement: {type: integer}
            coherence: {type: integer}
            vocabulary: {type: integer}
            grammar: {type: integer}
        comment: {type: [string, 'null'], description: null nếu bị bộ lọc BR-15 chặn}
        rewrites: {type: array, items: {type: string}}
        issues: {type: array, items: {$ref: '#/components/schemas/WritingIssue'}}
        vocabSuggestions: {type: array, items: {$ref: '#/components/schemas/WritingVocabSuggestion'}}
        submittedAt: {type: [string, 'null'], format: date-time}
        gradedAt: {type: [string, 'null'], format: date-time}
        nextRetryAt: {type: [string, 'null'], format: date-time}
    WritingHistory:
      type: object
      required: [items, scoreTrend, topIssueCategories]
      properties:
        items:
          type: array
          items:
            type: object
            required: [submissionId, status, promptSource, wordCount]
            properties:
              submissionId: {type: string, format: uuid}
              status: {type: string, enum: [draft, pending, retry_queued, graded, failed]}
              promptSource: {type: string, enum: [bank, ai_generated, freeform]}
              promptText: {type: [string, 'null']}
              wordCount: {type: integer}
              score: {type: [integer, 'null']}
              starsEarned: {type: [integer, 'null']}
              submittedAt: {type: [string, 'null'], format: date-time}
              gradedAt: {type: [string, 'null'], format: date-time}
        scoreTrend:
          type: array
          items:
            type: object
            required: [submissionId, gradedAt, score]
            properties:
              submissionId: {type: string, format: uuid}
              gradedAt: {type: string, format: date-time}
              score: {type: integer}
        topIssueCategories:
          type: array
          description: Tối đa 3 loại lỗi (severity error) gặp nhiều nhất
          items:
            type: object
            required: [category, count]
            properties:
              category: {type: string}
              count: {type: integer}
    CefrLevel:
      type: string
      enum: [A1, A2, B1, B2, C1, C2]
    ListeningClipItem:
      type: object
      required: [clipId, title, orderIndex, questionCount]
      properties:
        clipId: {type: string, format: uuid}
        title: {type: string}
        orderIndex: {type: integer}
        durationSec: {type: [integer, 'null']}
        questionCount: {type: integer}
        bestStars: {type: [integer, 'null'], description: Sao cao nhất người gọi từng đạt; null = chưa làm}
    ListeningClipView:
      type: object
      required: [clipId, title, topic, cefrLevel, audioUrl, audioUrlExpiresAt, questions]
      properties:
        clipId: {type: string, format: uuid}
        title: {type: string}
        topic: {type: string}
        cefrLevel: {$ref: '#/components/schemas/CefrLevel'}
        durationSec: {type: [integer, 'null']}
        audioUrl: {type: string, format: uri}
        audioUrlExpiresAt: {type: string, format: date-time}
        bestStars: {type: [integer, 'null']}
        questions:
          type: array
          items:
            type: object
            required: [questionId, type, text, options]
            properties:
              questionId: {type: string, format: uuid}
              type: {$ref: '#/components/schemas/ListeningQuestionType'}
              text: {type: string}
              options: {type: array, minItems: 4, maxItems: 4, items: {type: string}, description: 'Lựa chọn A, B, C, D theo thứ tự'}
    ListeningQuestionType:
      type: string
      enum: [choose_heard, fill_blank, dialogue_question]
      description: Listening.Answer.Types
    ListeningSubmitRequest:
      type: object
      required: [sessionId, clipId, answers]
      properties:
        sessionId: {type: string, format: uuid, description: Do client sinh để gửi lại an toàn}
        clipId: {type: string, format: uuid}
        startedAt: {type: string, format: date-time}
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, selectedAnswer]
            properties:
              questionId: {type: string, format: uuid}
              selectedAnswer: {type: string, enum: [A, B, C, D]}
    ListeningSessionResult:
      type: object
      required: [sessionId, clipId, correctCount, totalQuestions, stars, previousBest, starsAdded, completedAt, results, transcript]
      properties:
        sessionId: {type: string, format: uuid}
        clipId: {type: string, format: uuid}
        correctCount: {type: integer}
        totalQuestions: {type: integer}
        stars: {type: integer, minimum: 0, maximum: 5, description: BR-16}
        previousBest: {type: integer, description: Sao tốt nhất trước phiên này (0 nếu chưa làm)}
        starsAdded: {type: integer, description: 'BR-36: max(0, stars - previousBest)'}
        completedAt: {type: string, format: date-time}
        results:
          type: array
          items:
            type: object
            required: [questionId, selectedAnswer, correctAnswer, correct, explanation]
            properties:
              questionId: {type: string, format: uuid}
              selectedAnswer: {type: string}
              correctAnswer: {type: string}
              correct: {type: boolean}
              explanation: {type: string}
        transcript:
          type: array
          items:
            type: object
            required: [speaker, en, vi]
            properties:
              speaker: {type: string}
              en: {type: string}
              vi: {type: string}
    ListeningLineDraft:
      type: object
      properties:
        row: {type: [integer, 'null'], description: Dòng CSV gốc; null khi Admin thêm trên preview}
        speaker: {type: string}
        en: {type: string}
        vi: {type: string}
    ListeningClipDraft:
      type: object
      description: Một bài nghe trong preview; `voices` là người nói → tên giọng dựng sẵn của TTS
      properties:
        clipCode: {type: string}
        row: {type: [integer, 'null']}
        title: {type: string}
        topic: {type: string}
        cefrLevel: {type: string}
        voices: {type: object, additionalProperties: {type: string}}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ListeningLineDraft'}
        questions:
          type: array
          items:
            type: object
            properties:
              row: {type: [integer, 'null']}
              type: {type: string}
              text: {type: string}
              options: {type: array, items: {type: string}}
              answer: {type: string}
              explanation: {type: string}
    ImportIssue:
      type: object
      required: [code, message]
      description: Lỗi theo dòng CSV + cột để admin-web tô đỏ (UC-19 E3)
      properties:
        clipIndex: {type: [integer, 'null'], description: null = lỗi cả file}
        row: {type: [integer, 'null'], description: Số dòng CSV (đếm từ 1, dòng tiêu đề là 1)}
        column: {type: [string, 'null']}
        code: {type: string}
        message: {type: string}
    ImportJob:
      type: object
      required: [jobId, kind, status, attempts, createdAt, clips, warnings]
      properties:
        jobId: {type: string, format: uuid}
        kind: {type: string, enum: [listening_csv]}
        status: {type: string, enum: [queued, processing, preview_ready, saved, failed, cancelled]}
        attempts: {type: integer, description: Số lần sinh audio TTS}
        error: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        clips:
          type: array
          items:
            type: object
            required: [clip]
            properties:
              clip: {$ref: '#/components/schemas/ListeningClipDraft'}
              audio:
                type: [object, 'null']
                properties:
                  fingerprint: {type: string}
                  durationSec: {type: integer}
                  ttsModel: {type: string}
                  format: {type: string}
                  current: {type: boolean, description: Audio khớp lời thoại + giọng hiện tại (lưu được)}
              savedClipId: {type: [string, 'null'], format: uuid}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/ImportIssue'}
    AdminListeningClip:
      type: object
      required: [clipId, title, topic, cefrLevel, orderIndex, status, voices, lines, questions, audioFingerprint]
      properties:
        clipId: {type: string, format: uuid}
        title: {type: string}
        topic: {type: string}
        cefrLevel: {$ref: '#/components/schemas/CefrLevel'}
        orderIndex: {type: integer}
        status: {type: string, enum: [published, retired]}
        durationSec: {type: [integer, 'null']}
        ttsModel: {type: [string, 'null']}
        voices: {type: object, additionalProperties: {type: string}}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ListeningLineDraft'}
        questions:
          type: array
          items:
            type: object
            properties:
              questionId: {type: string, format: uuid}
              type: {$ref: '#/components/schemas/ListeningQuestionType'}
              text: {type: string}
              options: {type: array, items: {type: string}}
              answer: {type: string, enum: [A, B, C, D]}
              explanation: {type: string}
              status: {type: string, enum: [active, retired]}
        audioUrl: {type: [string, 'null'], format: uri}
        audioFingerprint: {type: string}
        retiredAt: {type: [string, 'null'], format: date-time}
